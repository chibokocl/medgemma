[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medgemma"
dynamic = ["version"]
description = "Medical AI on Apple Silicon – MedGemma 1.5 4B via MLX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "chiboko" }]
keywords = ["medical", "ai", "mlx", "apple-silicon", "medgemma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx-vlm>=0.3.10",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock"]

[project.scripts]
medgemma = "medgemma.cli:cli"

[tool.hatch.version]
path = "src/medgemma/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/medgemma"]
